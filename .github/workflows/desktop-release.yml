name: Desktop release

on:
  workflow_dispatch:
    inputs:
      xray_tag:
        description: Published XTLS/Xray-core release tag
        required: true
        type: string
      release_notes:
        description: Notes displayed in the desktop updater
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            bundle: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 60 || 35 }}
    env:
      DESKTOP_API_ORIGIN: ${{ vars.DESKTOP_API_ORIGIN }}
      DESKTOP_DIAGNOSTICS_ORIGIN: ${{ vars.DESKTOP_DIAGNOSTICS_ORIGIN }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run tauri -- icon public/favicon.svg
      # Stages the target-suffixed sidecars declared in bundle.externalBin.
      - name: Prepare and verify Xray sidecars
        run: python scripts/prepare_xray.py
        env:
          XRAY_RELEASE_TAG: ${{ inputs.xray_tag }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Configure HTTPS update channel
        shell: bash
        env:
          UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
        run: |
          python scripts/desktop_update.py configure --base "$UPDATE_BASE_URL" \
            --output "$RUNNER_TEMP/workspace-update.json"
      - name: Build and sign Windows installer for the updater
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} \
            --config "$RUNNER_TEMP/workspace-update.json"
      - name: Import Developer ID into a temporary keychain
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Apple signing secret: $name"
              exit 1
            fi
          done

          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/workspace-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          certificate=$(mktemp "$RUNNER_TEMP/workspace-cert.XXXXXX")
          probe=$(mktemp "$RUNNER_TEMP/workspace-codesign.XXXXXX")
          trap 'rm -f -- "$certificate" "$probe"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"

          echo "Creating and unlocking the signing keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          keychain_list=$(security list-keychains -d user)
          while IFS= read -r item; do
            if [[ "$item" =~ \"(.*)\" ]]; then
              existing_keychains+=("${BASH_REMATCH[1]}")
            fi
          done <<< "$keychain_list"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Importing the Developer ID certificate and authorizing codesign"
          security import "$certificate" -f pkcs12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          echo "Testing noninteractive access to the signing key"
          cp /usr/bin/true "$probe"
          chmod 700 "$probe"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            --timestamp=none --verbose=2 "$probe"
          codesign --verify --strict --verbose=2 "$probe"

      - name: Build and verify signed macOS bundles
        id: macos-bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg --verbose \
            --config "$RUNNER_TEMP/workspace-update.json"

          shopt -s nullglob
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          apps=("$bundle"/macos/*.app)
          images=("$bundle"/dmg/*.dmg)
          if (( ${#apps[@]} != 1 || ${#images[@]} != 1 )); then
            echo "::error::Expected one macOS application and one disk image."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --verify --strict --verbose=2 "${images[0]}"
          printf 'image=%s\napp=%s\n' "${images[0]}" "${apps[0]}" >> "$GITHUB_OUTPUT"

      - name: Notarize the signed disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          DMG_PATH: ${{ steps.macos-bundle.outputs.image }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Apple notarization secret: $name"
              exit 1
            fi
          done

          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          result="$RUNNER_TEMP/workspace-notarization.json"
          echo "Submitting the signed DMG and waiting up to 45 minutes for Apple"
          if ! xcrun notarytool submit "$DMG_PATH" "${auth[@]}" \
            --verbose --wait --timeout 45m --output-format json > "$result"; then
            echo "::error::notarytool submit failed or timed out. See the Apple diagnostics above."
            if [[ -s "$result" ]]; then cat "$result"; fi
            exit 1
          fi

          status=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' < "$result")
          submission=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])' < "$result")
          echo "Apple notarization status: $status (submission $submission)"
          if [[ "$status" != Accepted ]]; then
            xcrun notarytool log "$submission" "${auth[@]}" || true
            exit 1
          fi

      - name: Staple and validate the notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        env:
          DMG_PATH: ${{ steps.macos-bundle.outputs.image }}
          APP_PATH: ${{ steps.macos-bundle.outputs.app }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          xcrun stapler staple -v "$DMG_PATH"
          xcrun stapler validate -v "$DMG_PATH"
          xcrun stapler staple -v "$APP_PATH"
          xcrun stapler validate -v "$APP_PATH"

          # Tauri's initial archive predates stapling. Sign the archive containing the finished app.
          archive="$APP_PATH.tar.gz"
          tar -czf "$archive" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          rm -f -- "$archive.sig"
          npm run tauri -- signer sign "$archive"

      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/workspace-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
      - name: Upload Windows release assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.target }}
          path: |
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
      - name: Upload notarized macOS release assets
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.target }}
          path: |
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'MartiAble/YousoroWorkspace-app'
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installer-artifacts
          pattern: workspace-*
      - name: Assemble and publish signed desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          tag=$(python3 desktop-app/scripts/desktop_update.py manifest \
            --repo "$GITHUB_REPOSITORY" --base "$UPDATE_BASE_URL" \
            --config desktop-app/src-tauri/tauri.conf.json --artifacts installer-artifacts \
            --output release-assets --notes "$RELEASE_NOTES")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Increment the desktop version before publishing again."
            exit 1
          fi
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Yousoro Workspace ${tag#desktop-v}" \
            --notes "${RELEASE_NOTES:-Yousoro Workspace ${tag#desktop-v}}"
